[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vansh-local-ai-stack"
version = "1.4.0"
description = "Lightweight local AI automation toolkit for Windows — Ollama + Python CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["local-ai", "ollama", "automation"]

dependencies = [
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "pillow>=9.0.0",
    "pytesseract>=0.3.10",
    "pillow-heif>=0.7.0",
]

[project.scripts]
vls = "vls:main"

[tool.setuptools]
py-modules = ["vls"]

[tool.setuptools.packages.find]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
